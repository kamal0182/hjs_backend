# Production stack: gunicorn behind nginx. Only nginx is exposed.
#   cp backend/.env.prod.example backend/.env.prod   (then fill it in)
#   docker compose -f docker-compose.prod.yml up -d --build
#   -> app on http://localhost (put TLS in front of it for a real deployment)
services:
  # Not exposed: only reachable from the other containers on this network.
  db:
    image: postgres:17-alpine
    env_file:
      - ./backend/.env.prod
    environment:
      - POSTGRES_DB=hjs
      - POSTGRES_USER=hjs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hjs -d hjs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env.prod
    environment:
      # DATABASE_URL comes from .env.prod (it carries the Postgres password).
      # nginx is the one proxy in front of Django (see NUM_PROXIES in settings).
      - NUM_PROXIES=1
      # Shared by the gunicorn workers so login throttles count every attempt.
      - CACHE_URL=filecache:///app/data/cache
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # "Cron": hourly notification jobs (Traite due-date reminders by SMTP email).
  scheduler:
    build:
      context: ./backend
      target: production
    command: ["python", "manage.py", "run_scheduler"]
    env_file:
      - ./backend/.env.prod
    environment:
      - SKIP_MIGRATE=1
    volumes:
      - backend_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
  postgres_data:
