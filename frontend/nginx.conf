upstream backend {
    server backend:8000;
}

# Brute-force brake on the login endpoints (Django throttles too).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # Note: nginx drops these server-level headers in any location that sets
    # its own add_header, so such locations include security-headers.conf.
    include /etc/nginx/snippets/security-headers.conf;

    location = /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location = /admin/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Django: API, admin and the admin's static files. Same origin as the SPA,
    # so the HttpOnly refresh cookie works without CORS.
    location ~ ^/(api|admin|static)/ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The SPA itself: always serve index.html (navigation is in memory).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
