proxy_pass http://backend;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (never append to) the client-supplied header, so Django (NUM_PROXIES=1)
# sees the real client IP and a forged X-Forwarded-For cannot dodge throttling.
# If TLS is terminated by another proxy in front of nginx, enable ngx_http_realip
# for that proxy's address instead, so $remote_addr is still the client.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
